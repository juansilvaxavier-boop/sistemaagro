<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agroterra Sistema</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌱</text></svg>">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Login -->
  <section id="tela-login" class="login-wrap d-none">
    <div class="login-card shadow">
      <div class="text-center mb-4">
        <div class="logo-big"><i class="bi bi-flower1"></i></div>
        <h1 class="h4 mb-0">Agroterra Sistema</h1>
        <small class="text-muted">Venda, crédito, cobrança e logística</small>
      </div>
      <form id="form-login" autocomplete="on">
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input name="login" class="form-control" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input name="senha" type="password" class="form-control" required autocomplete="current-password">
        </div>
        <div id="login-erro" class="alert alert-danger py-2 d-none"></div>
        <button class="btn btn-success w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
      </form>
      <form id="form-empresa" class="d-none">
        <label class="form-label">Escolha a empresa</label>
        <div id="lista-empresas" class="list-group mb-3"></div>
      </form>
      <p class="text-center text-muted small mt-4 mb-0">Demonstração: <code>diretoria</code> / <code>agro123</code></p>
    </div>
  </section>

  <!-- Aplicação -->
  <div id="app" class="d-none">
    <aside id="sidebar">
      <div class="brand"><i class="bi bi-flower1"></i> <span>Agroterra</span></div>
      <div class="sidebar-user">
        <div class="avatar" id="user-avatar"></div>
        <div>
          <div class="fw-semibold" id="user-nome"></div>
          <small id="user-perfil"></small>
        </div>
      </div>
      <nav id="menu"></nav>
    </aside>
    <div id="main">
      <header id="topbar" class="d-flex align-items-center gap-2">
        <button class="btn btn-link text-dark d-lg-none" id="btn-menu" aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
        <div id="breadcrumb" class="fw-semibold text-truncate"></div>
        <div class="ms-auto d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary d-none d-md-inline-block" id="btn-empresa" title="Trocar empresa"><i class="bi bi-building"></i> <span id="empresa-nome"></span></button>
          <button class="btn btn-sm btn-outline-secondary position-relative" id="btn-mensagens" title="Mensagens">
            <i class="bi bi-chat-dots"></i>
            <span id="badge-msg" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
          </button>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i></button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#/senha"><i class="bi bi-key"></i> Alterar minha senha</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" id="btn-sair"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
            </ul>
          </div>
        </div>
      </header>
      <main id="conteudo" class="p-3"></main>
    </div>
  </div>

  <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/vendor/chart.js/chart.umd.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
