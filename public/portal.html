<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005826">
  <meta name="description" content="Portal do cliente Acelera Fertilizantes: pedidos, entregas, boletos e notas">
  <meta name="robots" content="noindex">
  <title>Portal do Cliente · Acelera Fertilizantes</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch.png">
  <script>
    try {
      document.documentElement.dataset.bsTheme = localStorage.getItem('agt-tema') === 'dark' ? 'dark' : 'light';
    } catch {}
  </script>
  <link rel="stylesheet" href="/vendor/fonte/index.css">
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: var(--bs-tertiary-bg); font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif; }
    .pt-topo { background: var(--bs-primary); color: #fff; }
    .pt-topo a, .pt-topo button { color: #fff; }
    .pt-wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
    .pt-nav { position: sticky; top: 0; z-index: 10; background: var(--bs-body-bg); border-bottom: 1px solid var(--bs-border-color); overflow-x: auto; white-space: nowrap; }
    .pt-nav a { display: inline-block; padding: .75rem .9rem; color: var(--bs-secondary-color); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 500; }
    .pt-nav a.ativo { color: var(--bs-primary); border-bottom-color: var(--bs-primary); }
    .pt-card { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .9rem; }
    .pt-kpi .v { font-size: 1.35rem; font-weight: 700; }
    .pt-kpi .l { font-size: .8rem; color: var(--bs-secondary-color); }
    .pt-passos { display: flex; gap: 4px; }
    .pt-passos > div { flex: 1; text-align: center; font-size: .7rem; color: var(--bs-secondary-color); }
    .pt-passos .barra { height: 6px; border-radius: 3px; background: var(--bs-secondary-bg); margin-bottom: 4px; }
    .pt-passos .feito .barra { background: var(--bs-primary); }
    .pt-passos .feito { color: var(--bs-body-color); }
    .pt-pedido { cursor: pointer; }
    .pt-pedido:hover { border-color: var(--bs-primary); }
    .pt-acesso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .pt-acesso .pt-card { width: 100%; max-width: 400px; }
    .pt-carrinho { position: sticky; bottom: 0; background: var(--bs-body-bg); border-top: 1px solid var(--bs-border-color); }
    .linha-digitavel { font-family: ui-monospace, monospace; font-size: .8rem; word-break: break-all; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app"><div class="pt-acesso"><div class="spinner-border text-success" role="status"><span class="visually-hidden">Carregando</span></div></div></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/portal.js"></script>
</body>
</html>
